name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  ORG: mx.exbel
  PROYECTO: exbel_venta

jobs:
  pruebas:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: SQLite para las pruebas
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  windows:
    name: Programa e instalador de Windows
    needs: pruebas
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generar carpeta de Windows
        run: flutter create --platforms=windows --org ${{ env.ORG }} --project-name ${{ env.PROYECTO }} .
      - name: Programa llamado exBelVenta.exe
        shell: pwsh
        run: (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "exBelVenta")' | Set-Content windows/CMakeLists.txt
      - run: flutter pub get
      - name: Ícono, título de la ventana y datos del programa
        shell: pwsh
        run: |
          dart run flutter_launcher_icons
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in "windows/runner/main.cpp", "windows/runner/Runner.rc") {
            (Get-Content $f) -replace 'exbel_venta', 'exBel venta' -replace 'mx\.exbel', 'exBel' | Set-Content $f
          }
          Select-String -Path windows/runner/main.cpp -Pattern 'Create'
      - name: F10 y Alt no activan el menú de Windows (F10 = buscar)
        shell: pwsh
        run: |
          $f = "windows/runner/flutter_window.cpp"
          $c = Get-Content $f -Raw
          $c = $c -replace 'case WM_FONTCHANGE:', "case WM_SYSCOMMAND:`r`n      if ((wparam & 0xFFF0) == SC_KEYMENU) return 0;`r`n      break;`r`n    case WM_FONTCHANGE:"
          Set-Content $f $c
          Select-String -Path $f -Pattern 'SC_KEYMENU'
          if (-not (Select-String -Path $f -Pattern 'SC_KEYMENU' -Quiet)) { exit 1 }
      - name: Revisar la clave de activación
        shell: pwsh
        env:
          EXBEL_SAL: ${{ secrets.EXBEL_SAL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXBEL_SAL)) { Write-Error 'Falta el secreto EXBEL_SAL en GitHub (Settings > Secrets and variables > Actions).'; exit 1 }
      - name: Compilar
        env:
          EXBEL_SAL: ${{ secrets.EXBEL_SAL }}
        run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=EXBEL_SAL=${{ env.EXBEL_SAL }}
      - name: Incluir las librerías de Visual C++ (para equipos que no las tienen)
        shell: pwsh
        run: |
          $destino = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $destino
          }
          Get-ChildItem $destino
      - name: Instalador (crea accesos directos en el escritorio y en Inicio)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DVersion=$version.${{ github.run_number }}" "/DOrigen=$PWD\build\windows\x64\runner\Release" "/DIcono=$PWD\windows\runner\resources\app_icon.ico" "/O$PWD\salida" instalador\exbel-venta.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem salida
      - uses: actions/upload-artifact@v4
        with:
          name: exbel-venta-instalador
          path: salida/exBel-venta-instalador.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exbel-venta-portable
          path: build/windows/x64/runner/Release/

  alerta:
    name: App exBel Alerta (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Crear el proyecto Android
        run: flutter create --platforms=android --org mx.exbel --project-name exbel_alerta .
      - name: Ajustar Android (permisos, servicio, firma)
        env:
          ALERTA_FIRMA: ${{ secrets.ALERTA_FIRMA }}
          ALERTA_CLAVE: ${{ secrets.ALERTA_CLAVE }}
        run: python3 ci/preparar_android.py
      - run: flutter pub get
      - name: Ícono
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Compilar APK
        env:
          ALERTA_CLAVE: ${{ secrets.ALERTA_CLAVE }}
        run: flutter build apk --release
      - name: Versión
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/ultima/exBel-alerta.apk"}\n' "$VER" "${{ github.repository }}" > alerta-version.json
          cp build/app/outputs/flutter-apk/app-release.apk exBel-alerta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: exbel-alerta
          path: |
            alerta/exBel-alerta.apk
            alerta/alerta-version.json

  publicar:
    name: Publicar descargas
    needs: [windows, alerta]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuente
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Preparar archivos
        run: |
          VER=$(grep -m1 '^version:' fuente/pubspec.yaml | sed 's/version: *//; s/+.*//')
          # El aviso apunta a un instalador con la versión en el nombre: ese
          # archivo nunca se borra ni se reemplaza mientras alguien lo descarga.
          # Se descarga por el espejo de la nube de exBel (llega aunque la red no
          # alcance los servidores de archivos de GitHub); el programa tiene
          # GitHub directo como respaldo.
          printf '{"version":"%s","url":"https://tdsyzimeafaxxocjpndd.supabase.co/functions/v1/exbel-descarga?v=%s"}\n' "$VER" "$VER" > version.json
          cat version.json
          cp artefactos/exbel-venta-instalador/exBel-venta-instalador.exe .
          cp exBel-venta-instalador.exe "exBel-venta-$VER-instalador.exe"
          cp artefactos/exbel-alerta/exBel-alerta.apk artefactos/exbel-alerta/alerta-version.json .
          mkdir "exBel venta" && cp -r artefactos/exbel-venta-portable/. "exBel venta/"
          zip -qr exBel-venta-portable.zip "exBel venta"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: exBel venta (última versión)
          prerelease: true
          make_latest: false
          body: |
            Compilación automática de `${{ github.sha }}`.
            - **Instalador:** descarga `exBel-venta-instalador.exe` y ábrelo. Crea el acceso directo en el escritorio.
            - **Portable:** `exBel-venta-portable.zip`, descomprímelo y abre `exBelVenta.exe`.
          files: |
            exBel-venta-*-instalador.exe
            exBel-venta-instalador.exe
            exBel-venta-portable.zip
            exBel-alerta.apk
      # Los avisos de versión se publican al final, cuando los archivos ya
      # están completos: así nadie intenta bajar algo que se está subiendo.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          prerelease: true
          make_latest: false
          files: |
            version.json
            alerta-version.json
