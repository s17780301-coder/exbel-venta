name: exbel_alerta
description: exBel Alerta, recibe el botón de emergencia de las cajas exBel venta.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  alarm: ^5.1.0
  flutter_foreground_task: ^11.0.3
  shared_preferences: ^2.3.0
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.0
  ota_update: ^7.1.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icono.png
  adaptive_icon_background: "#9E3A2B"
  adaptive_icon_foreground: assets/icono.png

flutter:
  uses-material-design: true
  assets:
    - assets/sirena.wav
